<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - ServiceFinder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">
  <div class="container">

    
    <a class="navbar-brand fw-bold" href="index.html">
      AccessAble
    </a>

    
    <div class="d-flex align-items-center gap-3 nav-buttons">
      <a class="nav-link text-white" href="index.html">Home</a>
      <a class="nav-link text-white" href="#">Listings</a>
      <a class="btn btn-outline-light" href="login.html">Login</a>
      <a class="btn btn-primary" href="sign-up.html">Sign Up</a>
    </div>

  </div>
</nav>


<div class="container d-flex justify-content-center align-items-center py-5">
  <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%;">
    <h3 class="text-center mb-4">Create Provider Account</h3>

    <form>
      <div class="mb-3">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" placeholder="Enter first name">
      </div>

      <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" placeholder="Enter last name">
      </div>

      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Create password">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" placeholder="Confirm password">
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>

      <div class="text-center">
        <small>Already have an account? 
          <a href="login.html">Login</a>
        </small>
      </div>
    </form>
  </div>
</div>

</body>
</html>
