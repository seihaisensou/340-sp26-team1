<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Listing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">


            <a class="navbar-brand fw-bold" href="index.html">
                AccessAble
            </a>


            <div class="d-flex align-items-center gap-3 nav-buttons">
                <a class="nav-link text-white" href="login.html">Account</a>
                <a class="nav-link text-white" href="../customer/listings.html">Listings</a>
                <a class="btn btn-outline-light" href="../customer/login.html">Login</a>
                <a class="btn btn-primary" href="../customer/sign-up.html">Sign Up</a>
            </div>

        </div>
    </nav>

    <div class="flex-grow-1">
        <div class="container py-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Edit Listing</h2>
                <p class="text-muted">Update your listing information below.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8">

                    <div class="card shadow-sm p-4">

                        <form>

                            <div class="mb-3">
                                <label class="form-label">Listing Title</label>
                                <input type="text" class="form-control"
                                    value="Professional Spanish Translation Services">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control"
                                    rows="4">Professional Spanish translation for documents and live events.</textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price</label>
                                <input type="text" class="form-control" value="$20/hr">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="../customer/listings.html" class="btn btn-outline-secondary">
                                    Cancel
                                </a>

                                <a href="../customer/listings.html" class="btn btn-outline-primary">
                                    Save Changes
                                </a>

                            </div>

                        </form>

                    </div>

                </div>
            </div>

        </div>
    </div>
    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">© 2026 AccessAble. All rights reserved.</p>
    </footer>
</body>

</html>
