<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Listing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">


            <a class="navbar-brand fw-bold" href="index.html">
                AccessAble
            </a>


            <div class="d-flex align-items-center gap-3 nav-buttons">
                <a class="nav-link text-white" href="login.html">Account</a>
                <a class="nav-link text-white" href="listings.html">Listings</a>
                <a class="btn btn-outline-light" href="login.html">Login</a>
                <a class="btn btn-primary" href="sign-up.html">Sign Up</a>
            </div>

        </div>
    </nav>

    <div class="flex-grow-1">
        <div class="container py-5">

            <div class="card shadow-lg p-4 mx-auto" style="max-width: 750px;">

                <h3 class="fw-bold mb-4 text-center">Create New Service Listing</h3>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Service Title</label>
                        <input type="text" class="form-control" placeholder="e.g. Professional Spanish Translator">
                    </div>


                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select">
                                <option>Translator</option>
                                <option>Interpretor</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pricing Type</label>
                            <select class="form-select">
                                <option>Flat Rate</option>
                                <option>Hourly</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Pricing($)</label>
                            <input type="number" class="form-control" placeholder="Enter price">
                        </div>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Short Description</label>
                        <input type="text" class="form-control" placeholder="Brief summary for listing card">
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Detailed Description</label>
                        <textarea class="form-control" rows="4"
                            placeholder="Describe your service in detail..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Upload Service Image</label>
                        <input type="file" class="form-control">
                    </div>


                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-control" placeholder="City, State">
                    </div>


                    <div class="mb-4">
                        <label class="form-label">Availability</label>
                        <input type="text" class="form-control" placeholder="Weekdays, Weekends, etc.">
                    </div>


                    <div class="text-center">
                        <a href="listings.html" class="btn btn-primary btn-lg px-5">
                            Publish Listing
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">© 2026 AccessAble. All rights reserved.</p>
    </footer>
</body>

</html>
