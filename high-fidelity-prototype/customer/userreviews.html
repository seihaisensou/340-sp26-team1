<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View Reviews</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">


            <a class="navbar-brand fw-bold" href="../provider/index.html">
                AccessAble
            </a>


            <div class="d-flex align-items-center gap-3 nav-buttons">
                <a class="nav-link text-white" href="account.html">Account</a>
                <a class="nav-link text-white" href="../customer/listings.html">Listings</a>
                <a class="btn btn-outline-light" href="login.html">Login</a>
                <a class="btn btn-primary" href="sign-up.html">Sign Up</a>
            </div>

        </div>
    </nav>

    <div class="flex-grow-1">
        <div class="container py-5">

            <div class="text-center mb-5">
                <h2 class="fw-bold">My Reviews</h2>
                <p class="text-muted">Read past reviews you've made.</p>
            </div>

            <div class="card shadow-sm p-4 mb-4">
                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold"><a href="../provider/listing-1.html"> Maria Gomez</a></h6>
                    <span class="text-warning">★★★★☆</span>
                </div>

                <p class="mt-2">
                    Great translator but response time could be faster.
                </p>

                <div class="mt-3">
                    <label class="form-label">Edit Review</label>
                    <textarea class="form-control mb-2" rows="2" placeholder="Edit your review..."></textarea>

                    <button class="btn btn-sm btn-primary">
                        Post new edit
                    </button>
                </div>
            </div>

            <div class="card shadow-sm p-4 mb-4">
                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold"><a href="../provider/listing-3.html"> Max Demian</a></h6>
                    <span class="text-warning">★★★★★</strong></span>
                </div>

                <p class="mt-2">
                    Fantastic translator. Superb quality and perfect communication times.
                </p>

                <div class="mt-3">
                    <label class="form-label">Edit Review</label>
                    <textarea class="form-control mb-2" rows="2" placeholder="Edit your review..."></textarea>

                    <button class="btn btn-sm btn-primary">
                        Post new edit
                    </button>
                </div>
            </div>


        </div>
    </div>
    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">© 2026 AccessAble. All rights reserved.</p>
    </footer>
